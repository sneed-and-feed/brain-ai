[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "brain-ai"
version = "0.1.0"
description = "Bi-Hemispheric Neuromorphic AI Architecture: Qwen LLM Left Hemisphere, Sapient HRM Right Hemisphere, Dale-Constrained E-I Corpus Callosum, and Open-Jev Amygdala"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "sneed-and-feed" }
]
dependencies = [
    "torch>=2.4.0",
    "transformers>=4.48.0",
    "accelerate>=0.34.0",
    "peft>=0.13.0",
    "einops>=0.8.0",
    "scipy>=1.13.0",
    "numpy>=1.26.0",
    "pydantic>=2.9.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.6.0"
]

[tool.hatch.build.targets.wheel]
packages = ["brain_ai"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
